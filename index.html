<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eu Apoio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f2f2f2;
    min-height:100vh;
    padding:40px 20px;
}

h1{
    text-align:center;
    font-size:4rem;
    margin-bottom:40px;
}

.container{
    display:flex;
    justify-content:center;
    gap:50px;
    flex-wrap:wrap;
}

.card{
    background:#d7dfe6;
    width:380px;
    padding:25px;
    border-radius:25px;
    text-align:center;
}

.preview-box{
    width:300px;
    height:300px;
    margin:auto;
    background:white;
    border-radius:15px;
    overflow:hidden;
    position:relative;
}

#originalPreview{
    width:100%;
    height:100%;
    object-fit:contain;
}

.editor{
    width:300px;
    height:300px;
    margin:auto;
    position:relative;
    overflow:hidden;
    background:white;
    border-radius:15px;
}

#userImage{
    position:absolute;
    top:0;
    left:0;
    cursor:grab;
    transform-origin:center center;
    user-select:none;
    touch-action:none;
}

#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.controls{
    margin-top:20px;
}

.zoom-label{
    margin-bottom:10px;
    font-weight:bold;
}

input[type="range"]{
    width:100%;
}

.btn{
    border:none;
    background:#6f4bb3;
    color:white;
    padding:14px 35px;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    margin-top:20px;
}

.btn:hover{
    opacity:0.9;
}

.hidden{
    display:none;
}

@media(max-width:900px){

    h1{
        font-size:2.5rem;
    }

    .container{
        flex-direction:column;
        align-items:center;
    }

}

</style>
</head>
<body>

<h1>EU APOIO</h1>

<div class="container">

    
    <div class="card">

        <div class="preview-box">
            <img id="originalPreview">
        </div>

        <input
            type="file"
            id="upload"
            accept="image/*"
            class="hidden">

        <button class="btn" id="uploadBtn">
            ENVIAR FOTO
        </button>

    </div>


    <div class="card">

        <div class="editor" id="editor">

            <img id="userImage">

          
            <img id="overlay" src="moldura.png">

        </div>

        <div class="controls">

            <div class="zoom-label">
                Zoom
            </div>

            <input
                type="range"
                id="zoom"
                min="0.5"
                max="3"
                step="0.01"
                value="1">

        </div>

        <button class="btn" id="downloadBtn">
            BAIXAR
        </button>

    </div>

</div>

<script>

const upload = document.getElementById('upload');
const uploadBtn = document.getElementById('uploadBtn');

const originalPreview =
document.getElementById('originalPreview');

const userImage =
document.getElementById('userImage');

const zoom =
document.getElementById('zoom');

let posX = 0;
let posY = 0;
let scale = 1;

let dragging = false;
let startX = 0;
let startY = 0;

uploadBtn.addEventListener('click', () => {
    upload.click();
});

upload.addEventListener('change', (e)=>{

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(ev){

        originalPreview.src = ev.target.result;

        userImage.src = ev.target.result;

        userImage.onload = ()=>{

            const editor = document.getElementById('editor');

            const fitScale = Math.max(
                editor.clientWidth / userImage.naturalWidth,
                editor.clientHeight / userImage.naturalHeight
            );

            scale = fitScale;

            zoom.value = fitScale;

            posX =
            (editor.clientWidth -
            userImage.naturalWidth * scale)/2;

            posY =
            (editor.clientHeight -
            userImage.naturalHeight * scale)/2;

            updateImage();

        };

    };

    reader.readAsDataURL(file);

});

function updateImage(){

    userImage.style.transform =
    `translate(${posX}px, ${posY}px) scale(${scale})`;

}

zoom.addEventListener('input', ()=>{

    scale = parseFloat(zoom.value);

    updateImage();

});

function startDrag(x,y){

    dragging = true;

    startX = x - posX;
    startY = y - posY;

}

function moveDrag(x,y){

    if(!dragging) return;

    posX = x - startX;
    posY = y - startY;

    updateImage();

}

function stopDrag(){

    dragging = false;

}

userImage.addEventListener('mousedown',(e)=>{
    startDrag(e.clientX,e.clientY);
});

window.addEventListener('mousemove',(e)=>{
    moveDrag(e.clientX,e.clientY);
});

window.addEventListener('mouseup',stopDrag);

userImage.addEventListener('touchstart',(e)=>{

    const touch = e.touches[0];

    startDrag(
        touch.clientX,
        touch.clientY
    );

});

window.addEventListener('touchmove',(e)=>{

    const touch = e.touches[0];

    moveDrag(
        touch.clientX,
        touch.clientY
    );

});

window.addEventListener('touchend',stopDrag);

document
.getElementById('downloadBtn')
.addEventListener('click', async ()=>{

    if(!userImage.src){
        alert('Envie uma foto primeiro.');
        return;
    }

    const canvas =
    document.createElement('canvas');

    canvas.width = 1080;
    canvas.height = 1080;

    const ctx =
    canvas.getContext('2d');

    const scaleFactor =
    canvas.width / 300;

    ctx.drawImage(
        userImage,
        posX * scaleFactor,
        posY * scaleFactor,
        userImage.naturalWidth *
        scale *
        scaleFactor,
        userImage.naturalHeight *
        scale *
        scaleFactor
    );

    const overlay =
    document.getElementById('overlay');

    await new Promise(resolve=>{

        if(overlay.complete){
            resolve();
        }else{
            overlay.onload = resolve;
        }

    });

    ctx.drawImage(
        overlay,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const link =
    document.createElement('a');

    link.download =
    'eu-apoio.png';

    link.href =
    canvas.toDataURL('image/png');

    link.click();

});

</script>

</body>
</html>
